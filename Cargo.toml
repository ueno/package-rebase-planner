[package]
name = "package-rebase-planner"
version = "0.1.0"
edition = "2024"
description = "A helper program to plan package rebase"
license = "MIT"

[[bin]]
name = "prp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1.92"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "string"] }
csv = "1.4"
goose-agent = "0.1.0-alpha.11"
goose-providers = { version = "0.1.0-alpha.11", features = ["rustls-tls"] }
libc = "0.2"
regex = "1.11"
rmcp = "3.1"
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
tokio-util = "0.7.19"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
ulid = "1.1"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tempdir = "0.3"